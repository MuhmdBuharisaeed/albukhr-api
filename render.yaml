services:
  - type: web
    name: albukhr-api
    runtime: node

    buildCommand: npm install && npm run check
    startCommand: npm start

    healthCheckPath: /health

    autoDeployTrigger: commit

    envVars:
      - key: NODE_ENV
        value: production

      - key: PI_API_KEY
        sync: false

      - key: SUPABASE_URL
        sync: false

      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

      - key: ALLOWED_ORIGINS
        sync: false
