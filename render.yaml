services:
  - type: web
    name: albukhr-api
    runtime: node

    buildCommand: npm install && npm run check
    startCommand: npm start

    healthCheckPath: /health

    autoDeployTrigger: commit

    envVars:
      # =====================================================
      # APPLICATION ENVIRONMENT
      # =====================================================

      - key: NODE_ENV
        value: production

      # =====================================================
      # MAINNET PI PLATFORM
      # =====================================================

      - key: PI_API_KEY
        sync: false

      # =====================================================
      # MAINNET SUPABASE
      # =====================================================

      - key: SUPABASE_URL
        sync: false

      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

      # =====================================================
      # CORS
      # Comma-separated list of approved frontend origins.
      # =====================================================

      - key: ALLOWED_ORIGINS
        sync: false

      # =====================================================
      # DAPP SERVICE V2
      # Disabled until database schema, RLS, authorization,
      # and request lifecycle have been verified.
      # =====================================================

      - key: DAPP_SERVICE_V2_ENABLED
        value: "false"

      # Dedicated DApp Service database configuration.
      # Use the verified Mainnet Supabase project only.
      # Never put a service-role key directly in this file.
      - key: DAPP_SERVICE_SUPABASE_URL
        sync: false

      - key: DAPP_SERVICE_SUPABASE_SERVICE_ROLE_KEY
        sync: false

      # Public anon key is used only to validate user JWT/admin context.
      # It is not a service-role secret; configure the matching Mainnet key in Render.
      - key: DAPP_SERVICE_SUPABASE_ANON_KEY
        sync: false

      # This API deployment serves Mainnet only.
      - key: DAPP_SERVICE_NETWORK
        value: mainnet

      # The gateway appends /me to this base URL.
      # Resulting identity endpoint: /v2/me
      - key: DAPP_SERVICE_PI_API_BASE
        value: https://api.minepi.com/v2

      # Must match the current service terms accepted by users.
      - key: DAPP_SERVICE_CONSENT_VERSION
        value: v1
